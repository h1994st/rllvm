name: rllvm CI

# No `paths-ignore`: these jobs are required status checks on `main`, and a
# required check whose workflow never runs leaves a pull request waiting on a
# status that will never arrive. Running CI on a docs-only change costs a few
# minutes; a permanently unmergeable pull request costs more.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # Pinned so both runners test the same toolchain. Unpinned, Linux got
  # Ubuntu's default and macOS got Homebrew's latest -- four majors apart.
  LLVM_VERSION: "22"

jobs:
  test:
    name: Build and Test (${{ matrix.os }})
    needs: [fmt-check, clippy]
    strategy:
      # One platform failing should not hide the results for the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install stable toolchain
        run: rustup update stable

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install LLVM/Clang
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --all --verbose

  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Install stable toolchain
        run: rustup update stable

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run cargo fmt
        run: cargo fmt --all --check --verbose

  clippy:
    name: Clippy Check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install stable toolchain
        run: rustup update stable

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install LLVM/Clang
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - name: Install MSRV toolchain
        run: rustup update 1.88

      - name: Set MSRV as default
        run: rustup default 1.88

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install LLVM/Clang
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Build with MSRV
        run: cargo build --verbose

  coverage:
    runs-on: ubuntu-latest
    needs: [fmt-check, test]
    steps:
      - name: Install stable toolchain
        run: rustup update stable

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install LLVM/Clang
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage reports
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: lcov.info
          fail_ci_if_error: false
