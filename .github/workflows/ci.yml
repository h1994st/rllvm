name: rllvm CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and Test (${{ matrix.os }})
    needs: [fmt-check, clippy]
    strategy:
      # One platform failing should not hide the results for the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install stable toolchain
        run: rustup update stable

      - name: Install LLVM/Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt install -y llvm llvm-dev clang libclang-dev
          command -v llvm-config && clang -v

      - name: Install LLVM/Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm

      - name: Install LLVM/Clang (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: cargo build --verbose

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --all --verbose

      # The LLVM package for Windows does not ship `llvm-config`, which the test
      # configuration is derived from, so the test suite cannot run there. The
      # build above still guards against Windows-specific compile errors, and
      # the COFF embedding logic is covered by unit tests that construct objects
      # in memory and therefore run on Linux and macOS.
      - name: Skip tests (Windows)
        if: runner.os == 'Windows'
        run: echo "Tests are not run on Windows; llvm-config is unavailable."

  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Install stable toolchain
        run: rustup update stable

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run cargo fmt
        run: cargo fmt --all --check --verbose

  clippy:
    name: Clippy Check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install stable toolchain
        run: rustup update stable

      - name: Install LLVM/Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt install -y llvm llvm-dev clang libclang-dev
          command -v llvm-config && clang -v

      - name: Install LLVM/Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm

      - name: Install LLVM/Clang (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - name: Install MSRV toolchain
        run: rustup update 1.88

      - name: Set MSRV as default
        run: rustup default 1.88

      - name: Install LLVM/Clang
        run: |
          sudo apt install -y llvm llvm-dev clang libclang-dev

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with MSRV
        run: cargo build --verbose

  coverage:
    runs-on: ubuntu-latest
    needs: [fmt-check, test]
    steps:
      - name: Install stable toolchain
        run: rustup update stable

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage reports
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: lcov.info
          fail_ci_if_error: false
