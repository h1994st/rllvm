name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required to dispatch the release workflow. workflow_dispatch is one of the
  # two events GitHub lets the default GITHUB_TOKEN trigger, which is why this
  # design needs no PAT or GitHub App.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The packages dist builds an app for, by their release-please path. A
    # release build creates their tags; the tagging step creates every other
    # package's. Together the two must cover `packages` in
    # release-please-config.json, because a package in neither is never tagged
    # at all -- see that step for what that costs. One list rather than two:
    # adding a package to the config tags it by default, and only promoting it
    # to a dist app edits this line.
    env:
      DIST_APPS: "crates/tools crates/query"
    steps:
      # release-please labels its release PR `autorelease: pending` and flips it
      # to `autorelease: tagged` once it creates the release. With
      # skip-github-release: true it never creates one, so the label stays
      # pending forever and every subsequent run aborts with:
      #
      #   There are untagged, merged release PRs outstanding - aborting
      #
      # which blocks all releases after the first. cargo-dist created the tag
      # instead, so reconcile the label here -- before release-please runs, so it
      # sees a clean slate.
      #
      # The label is no longer what retries a failed release: it is reconciled
      # against rllvm's tag alone, so a release that tagged rllvm but not
      # rllvm-query still clears. What retries is the dispatch step below, which
      # re-dispatches any component whose tag is missing on every push to main.
      - uses: actions/checkout@v7

      - name: Reconcile labels on already-released PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Read the label names from release-please's own config rather than
          # hardcoding them, so the two cannot drift apart. They are top-level
          # now (not per-package): a manifest release spanning multiple
          # packages still has one release PR and one label pair for it.
          PENDING="$(jq -er '.label' release-please-config.json)"
          TAGGED="$(jq -er '.["release-label"]' release-please-config.json)"

          gh label create "$TAGGED" --repo "$REPO" \
            --color ededed --description 'Release PR whose version has been tagged' \
            2>/dev/null || true

          # With multiple packages the release PR title is generic ("chore:
          # release main") and carries no version, so it can no longer tell us
          # what was released. main's checked-out .release-please-manifest.json
          # can: a merged release PR is exactly what wrote that file, so its
          # "crates/tools" entry is the version the rllvm component last
          # released at. rllvm is the witness because it is the component
          # almost every release bumps; rllvm-core has no dist app and reaches
          # crates.io through the publish job instead. A release PR that bumps
          # only rllvm-query is reconciled against rllvm's existing tag and so
          # clears early, which is still the point of this step: unblocking the
          # next run.
          VER="$(jq -er '.["crates/tools"]' .release-please-manifest.json)"
          TAG="rllvm-v${VER}"

          gh pr list --repo "$REPO" --state merged --label "$PENDING" \
            --json number --limit 20 | jq -c '.[]' | while read -r pr; do
            NUM="$(jq -r '.number' <<<"$pr")"

            if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "::notice::${TAG} is tagged; marking PR #${NUM} as released."
              gh pr edit "$NUM" --repo "$REPO" \
                --add-label "$TAGGED" --remove-label "$PENDING"
            else
              echo "::notice::${TAG} is not tagged yet; leaving PR #${NUM} pending."
            fi
          done

      # Maintains the release PR: version bump, Cargo.lock, CHANGELOG.
      # skip-github-release is set in release-please-config.json, so this never
      # tags or releases -- cargo-dist does both, because whoever creates the
      # GitHub Release owns its notes and we want dist's (install instructions).
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Decide whether a release is due by comparing release-please's own record
      # of each package's current version against the tags that exist. The
      # action's release_created output is not usable here: it describes
      # releases the action created, and skip-github-release means it creates
      # none.
      #
      # The failure this guards against is quiet: a merged version bump and
      # CHANGELOG with no release and nothing visibly broken. So anything other
      # than "tag exists" or "dispatch succeeded" fails the job.
      #
      # dist makes one singular announcement per component tag -- one tag
      # releases exactly one package -- so this loops over DIST_APPS, the
      # packages dist builds an app for. rllvm-core is a library with no dist
      # app; it reaches crates.io through the publish job instead, so it is
      # deliberately never dispatched here and is tagged by the step below.
      - name: Dispatch the release build when a release is due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          for PKG_PATH in $DIST_APPS; do
            COMPONENT="$(jq -er --arg pkg "$PKG_PATH" \
              '.packages[$pkg].component' release-please-config.json)"
            VERSION="$(jq -er --arg pkg "$PKG_PATH" '.[$pkg]' .release-please-manifest.json)"
            TAG="${COMPONENT}-v${VERSION}"

            if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "::notice::${TAG} is already released; nothing to do."
              continue
            fi

            echo "::notice::${TAG} has no tag yet - dispatching the release build."
            gh workflow run release.yml --ref main -f tag="${TAG}"
          done

      # Tag every other package. Only a release build tags the ones above, and
      # release-please tags nothing at all (skip-github-release), so a package
      # dist has no app for was never tagged at any version it released.
      #
      # release-please finds a package's last release by its tag. Without one it
      # walks back to whatever older tag it can find and re-proposes changes it
      # already shipped: after 0.6.0 it reread #217's breaking change from the
      # 0.5.1 anchor and proposed rllvm-core 0.7.0, dragging both dependents to
      # 0.6.1 through the cargo-workspace plugin. Every cycle would have
      # escalated again, and nothing about it looked wrong -- the release PR
      # just kept claiming a bump nobody asked for.
      #
      # A plain tag, not a GitHub Release: a tag is all release-please reads,
      # and a library that ships no artifacts has nothing to put in a release.
      - name: Tag the packages no release build tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for PKG_PATH in $(jq -er '.packages | keys[]' release-please-config.json); do
            # Word-boundary match, so "crates/core" cannot match "crates/core2".
            case " $DIST_APPS " in
              *" $PKG_PATH "*) continue ;;
            esac

            COMPONENT="$(jq -er --arg pkg "$PKG_PATH" \
              '.packages[$pkg].component' release-please-config.json)"
            VERSION="$(jq -er --arg pkg "$PKG_PATH" '.[$pkg]' .release-please-manifest.json)"
            TAG="${COMPONENT}-v${VERSION}"

            if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "::notice::${TAG} is already tagged; nothing to do."
              continue
            fi

            echo "::notice::tagging ${TAG} at ${SHA}."
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="$SHA" >/dev/null
          done
