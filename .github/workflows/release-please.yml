name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required to dispatch the release workflow. workflow_dispatch is one of the
  # two events GitHub lets the default GITHUB_TOKEN trigger, which is why this
  # design needs no PAT or GitHub App.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please labels its release PR `autorelease: pending` and flips it
      # to `autorelease: tagged` once it creates the release. With
      # skip-github-release: true it never creates one, so the label stays
      # pending forever and every subsequent run aborts with:
      #
      #   There are untagged, merged release PRs outstanding - aborting
      #
      # which blocks all releases after the first. cargo-dist created the tag
      # instead, so reconcile the label here -- before release-please runs, so it
      # sees a clean slate. Self-healing: a release that never tagged keeps its
      # pending label and is retried rather than silently marked done.
      - uses: actions/checkout@v7

      - name: Reconcile labels on already-released PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Read the label names from release-please's own config rather than
          # hardcoding them, so the two cannot drift apart. They are top-level
          # now (not per-package): a manifest release spanning multiple
          # packages still has one release PR and one label pair for it.
          PENDING="$(jq -er '.label' release-please-config.json)"
          TAGGED="$(jq -er '.["release-label"]' release-please-config.json)"

          gh label create "$TAGGED" --repo "$REPO" \
            --color ededed --description 'Release PR whose version has been tagged' \
            2>/dev/null || true

          # With multiple packages the release PR title is generic ("chore:
          # release main") and carries no version, so it can no longer tell us
          # what was released. main's checked-out .release-please-manifest.json
          # can: a merged release PR is exactly what wrote that file, so its
          # "crates/tools" entry is the version the rllvm component last
          # released at. dist only ever tags rllvm-v<version> (rllvm-core has
          # no dist app and reaches crates.io through the publish job instead),
          # so that is the one tag whose existence proves the release landed.
          VER="$(jq -er '.["crates/tools"]' .release-please-manifest.json)"
          TAG="rllvm-v${VER}"

          gh pr list --repo "$REPO" --state merged --label "$PENDING" \
            --json number --limit 20 | jq -c '.[]' | while read -r pr; do
            NUM="$(jq -r '.number' <<<"$pr")"

            if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "::notice::${TAG} is tagged; marking PR #${NUM} as released."
              gh pr edit "$NUM" --repo "$REPO" \
                --add-label "$TAGGED" --remove-label "$PENDING"
            else
              echo "::notice::${TAG} is not tagged yet; leaving PR #${NUM} pending."
            fi
          done

      # Maintains the release PR: version bump, Cargo.lock, CHANGELOG.
      # skip-github-release is set in release-please-config.json, so this never
      # tags or releases -- cargo-dist does both, because whoever creates the
      # GitHub Release owns its notes and we want dist's (install instructions).
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Decide whether a release is due by comparing release-please's own record
      # of each package's current version against the tags that exist. The
      # action's release_created output is not usable here: it describes
      # releases the action created, and skip-github-release means it creates
      # none.
      #
      # The failure this guards against is quiet: a merged version bump and
      # CHANGELOG with no release and nothing visibly broken. So anything other
      # than "tag exists" or "dispatch succeeded" fails the job.
      #
      # dist makes one singular announcement per component tag -- one tag
      # releases exactly one package -- so this loops over the components dist
      # actually builds an app for. rllvm-core is a library with no dist app;
      # it reaches crates.io through the publish job instead, so it is
      # deliberately never dispatched here. Add a "path:component" line as
      # dist grows more apps (e.g. crates/query once it exists).
      - name: Dispatch the release build when a release is due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PACKAGES=(
            "crates/tools:rllvm"
          )

          for entry in "${PACKAGES[@]}"; do
            PKG_PATH="${entry%%:*}"
            COMPONENT="${entry##*:}"

            VERSION="$(jq -er --arg pkg "$PKG_PATH" '.[$pkg]' .release-please-manifest.json)"
            TAG="${COMPONENT}-v${VERSION}"

            if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "::notice::${TAG} is already released; nothing to do."
              continue
            fi

            echo "::notice::${TAG} has no tag yet - dispatching the release build."
            gh workflow run release.yml --ref main -f tag="${TAG}"
          done
