name: Bump the Homebrew tap

# Asks the tap to open the pull request that points its formula at this
# release. Separate from `release.yml` because that file is generated by
# cargo-dist and is rewritten by `dist init`.
#
# `release: published` fires after the assets are attached: the release job
# creates the release and uploads every artifact in one `gh release create`
# call, so both assets named below already exist when this runs.
#
# The asset URLs are sent rather than left to the tap to guess: this repository
# is what knows how cargo-dist names its output, and the tap should not carry a
# convention on its behalf.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dispatch:
    # A prerelease is not something the tap should ship.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Ask the tap to open a bump pull request
        env:
          # Needs write access to the tap repository; GITHUB_TOKEN is scoped to
          # this one and cannot dispatch to another.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          # The `secrets` context is not available in a job-level `if`, so the
          # check lives here. Warning rather than failing keeps a release green
          # before the token is configured, and while it is being rotated.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap was" \
                 "not asked to bump. Run the tap's Bump formula workflow by" \
                 "hand to publish this release."
            exit 0
          fi

          tag="${{ github.event.release.tag_name }}"
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/$tag"

          gh api "repos/${{ github.repository_owner }}/homebrew-tap/dispatches" \
            -f "event_type=upstream-released" \
            -f "client_payload[formula]=rllvm" \
            -f "client_payload[tag]=$tag" \
            -f "client_payload[url]=$base/source.tar.gz" \
            -f "client_payload[sha256_url]=$base/source.tar.gz.sha256"
