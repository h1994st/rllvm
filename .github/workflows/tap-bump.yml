name: Bump the Homebrew tap

# Asks the tap to open the pull request that points its formula at this
# release. Separate from `release.yml` because that file is generated by
# cargo-dist and is rewritten by `dist init`.
#
# Triggered by the release build finishing, NOT by `release: published`. The
# release is created by `release.yml` running under the default GITHUB_TOKEN,
# and GitHub does not start a workflow from an event that token produced -- so
# a `release` trigger here never fires. `release-please.yml` documents the same
# constraint and works around it the same way. `workflow_run` reports a run
# completing rather than an event a token created, so it is unaffected.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bump the tap to (e.g. v0.4.4)
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    # `Release` also runs on `pull_request`, where cargo-dist builds artifacts
    # without releasing anything. Only the `workflow_dispatch` run on `main` is
    # a real release -- that is how `release-please.yml` starts one -- so every
    # other completion is ignored rather than bumping the tap to a version it
    # already has.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ask the tap to open a bump pull request
        env:
          # Reads this repository; the tap is a different one, and the default
          # token cannot dispatch across repositories.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap was" \
                 "not asked to bump. Run the tap's Bump formula workflow by" \
                 "hand to publish this release."
            exit 0
          fi

          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v$(jq -er '."."' .release-please-manifest.json)"
          fi

          # The release build can succeed on a dry run, and a draft release is
          # not one the tap should ship. Both are checked rather than assumed.
          if ! state=$(gh release view "$tag" --repo "$REPO" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null); then
            echo "::notice::No release $tag; nothing to bump."
            exit 0
          fi

          case "$state" in
            "false false") ;;
            *)
              echo "::notice::$tag is draft/prerelease ($state); not bumping the tap."
              exit 0
              ;;
          esac

          base="${{ github.server_url }}/$REPO/releases/download/$tag"

          GH_TOKEN="$TAP_TOKEN" gh api \
            "repos/${{ github.repository_owner }}/homebrew-tap/dispatches" \
            -f "event_type=upstream-released" \
            -f "client_payload[formula]=rllvm" \
            -f "client_payload[tag]=$tag" \
            -f "client_payload[url]=$base/source.tar.gz" \
            -f "client_payload[sha256_url]=$base/source.tar.gz.sha256"

          echo "::notice::Asked the tap to bump rllvm to $tag."
