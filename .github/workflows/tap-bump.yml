name: Bump the Homebrew tap

# Asks the tap to open the pull request that points its formula at this
# release.
#
# Called by the release workflow as a dist `post-announce-job`, not triggered
# by an event. Nothing this repository emits can start it: the release is made
# by `release.yml` running under the default GITHUB_TOKEN, and GitHub starts no
# workflow from anything in a GITHUB_TOKEN-initiated chain -- neither the
# `release` event, nor `workflow_run` on the release build finishing, nor the
# tag push. `release-please.yml` documents the same constraint. Being called
# as part of that run sidesteps the question entirely.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bump the tap to (e.g. v0.4.5)
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the tap to open a bump pull request
        env:
          # `GH_TOKEN` reads this repository; the tap is a different one, and
          # the default token cannot dispatch across repositories.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PLAN: ${{ inputs.plan }}
          TAG_INPUT: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap was" \
                 "not asked to bump. Run the tap's Bump formula workflow by" \
                 "hand to publish this release."
            exit 0
          fi

          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            tag=$(jq -er '.announcement_tag' <<<"$PLAN")
            # `jq -e` exits 1 on a false result, which under `set -e` would
            # fail the job on exactly the releases that should proceed.
            if [ "$(jq -r '.announcement_is_prerelease' <<<"$PLAN")" = "true" ]; then
              echo "::notice::$tag is a prerelease; not bumping the tap."
              exit 0
            fi
          fi

          base="${{ github.server_url }}/$REPO/releases/download/$tag"

          GH_TOKEN="$TAP_TOKEN" gh api \
            "repos/${{ github.repository_owner }}/homebrew-tap/dispatches" \
            -f "event_type=upstream-released" \
            -f "client_payload[formula]=rllvm" \
            -f "client_payload[tag]=$tag" \
            -f "client_payload[url]=$base/source.tar.gz" \
            -f "client_payload[sha256_url]=$base/source.tar.gz.sha256"

          echo "::notice::Asked the tap to bump rllvm to $tag."
