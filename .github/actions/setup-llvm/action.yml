name: Set up LLVM
description: >
  Installs a pinned LLVM/Clang toolchain from official channels and puts it
  first on PATH. Pinning matters: rllvm shells out to llvm-config, llvm-link,
  llvm-ar, llvm-objcopy and llvm-dis, and an unpinned install gave Ubuntu's
  default on Linux and Homebrew's latest on macOS, so the two runners
  tested different toolchains.

inputs:
  version:
    description: LLVM major version to install
    required: true
  llvm-sys:
    description: >
      The llvm-sys major version this toolchain has to satisfy, as pinned in
      crates/query/Cargo.toml (e.g. "231"). When set, the action exports the
      LLVM_SYS_<version>_PREFIX variable llvm-sys reads, and fails if the
      installed toolchain would need a different one. Leave unset to only put
      the toolchain on PATH.
    required: false
    default: ""

outputs:
  prefix:
    description: >
      Filesystem prefix of the installed LLVM toolchain, for consumers such as
      llvm-sys's LLVM_SYS_<version>_PREFIX that cannot rely on llvm-config
      being on PATH (e.g. Homebrew's keg-only install).
    value: ${{ steps.resolve-prefix.outputs.prefix }}

runs:
  using: composite
  steps:
    # LLVM's own apt repository, so any supported major version is available
    # rather than whatever the distribution happens to ship.
    - name: Install LLVM ${{ inputs.version }} (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        chmod +x /tmp/llvm.sh
        sudo /tmp/llvm.sh "${{ inputs.version }}"
        sudo apt-get install -y \
          "llvm-${{ inputs.version }}-dev" "libclang-${{ inputs.version }}-dev" \
          "libpolly-${{ inputs.version }}-dev"
        echo "/usr/lib/llvm-${{ inputs.version }}/bin" >> "$GITHUB_PATH"

    - name: Install LLVM ${{ inputs.version }} (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install "llvm@${{ inputs.version }}"
        echo "$(brew --prefix "llvm@${{ inputs.version }}")/bin" >> "$GITHUB_PATH"

    # Fails fast if the pin did not take, rather than letting a test fail later
    # with a confusing version-skew error.
    - name: Verify the pinned toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "llvm-config: $(llvm-config --version)"
        clang --version | head -1
        for tool in clang clang++ llvm-link llvm-ar llvm-objcopy llvm-dis; do
          command -v "$tool" >/dev/null || { echo "missing: $tool" >&2; exit 1; }
        done
        case "$(llvm-config --version)" in
          "${{ inputs.version }}".*) ;;
          *) echo "expected LLVM ${{ inputs.version }}, got $(llvm-config --version)" >&2; exit 1 ;;
        esac

    - name: Resolve the toolchain prefix
      id: resolve-prefix
      shell: bash
      run: echo "prefix=$(llvm-config --prefix)" >> "$GITHUB_OUTPUT"

    # llvm-sys reads LLVM_SYS_<major><minor>_PREFIX and silently builds nothing
    # useful without it, so the release would fail at link time instead. Derive
    # the minor from the toolchain rather than assuming 1, which is wrong for
    # any LLVM x.0, and refuse to continue if that disagrees with the pin.
    - name: Export the prefix variable llvm-sys reads
      if: inputs.llvm-sys != ''
      shell: bash
      env:
        PIN: ${{ inputs.llvm-sys }}
        PREFIX: ${{ steps.resolve-prefix.outputs.prefix }}
      run: |
        set -euo pipefail
        version="$(llvm-config --version)"
        rest="${version#*.}"
        needs="${version%%.*}${rest%%.*}"
        if [ "$needs" != "$PIN" ]; then
          echo "::error::LLVM ${version} is read through LLVM_SYS_${needs}_PREFIX, but llvm-sys ${PIN} reads LLVM_SYS_${PIN}_PREFIX"
          exit 1
        fi
        echo "LLVM_SYS_${PIN}_PREFIX=${PREFIX}" >> "$GITHUB_ENV"
