[package]
name = "rllvm-query"
version = "0.6.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Source-level queries over LLVM bitcode captured by rllvm"
categories = ["development-tools", "command-line-utilities"]
keywords = ["llvm", "bitcode", "analysis", "mcp"]
readme = "README.md"
exclude = ["tests/*"]

[dependencies]
rllvm-core = { path = "../core", version = "0.6.2" }
# The only crate in the workspace that links LLVM, which is why it is kept out
# of `default-members`: `cargo test` never builds llvm-sys. Needs
# LLVM_SYS_231_PREFIX pointing at an LLVM 23 install when llvm-config is not on
# PATH. `force-static` because a dynamic libLLVM reference makes the released
# binary unusable anywhere the matching shared library is missing.
llvm-sys = { version = "231", features = ["force-static"] }
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustc-demangle = "0.1.28"
owo-colors.workspace = true
# Decides whether stdout should be coloured. A direct dependency rather than
# owo-colors' `supports-colors` feature: that feature declares both
# supports-color 3.0 and 2.0 (aliased) for API compatibility, so it locks
# three crates where this locks two -- `supports-color` and `is_ci`.
supports-color = "3.0"

[dev-dependencies]
rllvm-testkit = { path = "../testkit" }
tempfile.workspace = true

[[bin]]
name = "rllvm-query"
path = "src/bin/rllvm_query.rs"
