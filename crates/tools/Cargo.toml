[package]
name = "rllvm"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "A tool to build whole-program LLVM bitcode files"
categories = ["command-line-utilities", "development-tools", "development-tools::build-utils"]
keywords = ["llvm", "clang", "bitcode", "IR", "gllvm"]
readme = "README.md"
exclude = ["tests/*"]

# dist enumerates every `[[bin]]`, including rllvm-query, which needs the
# `query` feature and so does not exist in the default build dist performs --
# the 0.5.1 release failed on `failed to find bin rllvm-query`. The override
# is per target, and a target left out silently falls back to every binary,
# so every entry in `targets` is listed here. tests/packaging.rs keeps the
# two in step.
[package.metadata.dist.binaries]
aarch64-apple-darwin = [
  "rllvm-cc",
  "rllvm-cxx",
  "rllvm-get-bc",
  "rllvm-init",
  "rllvm-completions",
  "rllvm-rustc",
  "rllvm-info",
  "rllvm-compdb",
]
x86_64-apple-darwin = [
  "rllvm-cc",
  "rllvm-cxx",
  "rllvm-get-bc",
  "rllvm-init",
  "rllvm-completions",
  "rllvm-rustc",
  "rllvm-info",
  "rllvm-compdb",
]
aarch64-unknown-linux-gnu = [
  "rllvm-cc",
  "rllvm-cxx",
  "rllvm-get-bc",
  "rllvm-init",
  "rllvm-completions",
  "rllvm-rustc",
  "rllvm-info",
  "rllvm-compdb",
]
x86_64-unknown-linux-gnu = [
  "rllvm-cc",
  "rllvm-cxx",
  "rllvm-get-bc",
  "rllvm-init",
  "rllvm-completions",
  "rllvm-rustc",
  "rllvm-info",
  "rllvm-compdb",
]
x86_64-unknown-linux-musl = [
  "rllvm-cc",
  "rllvm-cxx",
  "rllvm-get-bc",
  "rllvm-init",
  "rllvm-completions",
  "rllvm-rustc",
  "rllvm-info",
  "rllvm-compdb",
]

[features]
# Links LLVM via llvm-sys for source-level queries over captured bitcode.
# Kept as the crate's only feature: mutually exclusive LLVM features would
# break `cargo llvm-cov --all-features` in CI.
query = ["dep:llvm-sys", "llvm-sys/force-static"]

[dependencies]
clap = {version = "~4.5.48", features = ["derive"]}
clap_complete = "~4.5"
toml = "~0.8"
object = {version = "~0.40.0", features = ["all"]}
regex = "~1.11.3"
serde = {version = "~1.0.227", features = ["derive"]}
tracing = "~0.1"
tracing-subscriber = {version = "~0.3", features = ["env-filter"]}
owo-colors = "~4.1"
thiserror = "~2.0"
which = "~8.0.0"
# Used by the rustc wrapper to stage marker objects and unpack archives;
# RAII cleanup matters because those paths return early on error.
tempfile = "~3"
serde_json = "1.0"
sha2 = "0.10"
# Optional: only pulled in by the `query` feature. Needs LLVM_SYS_231_PREFIX
# pointing at an LLVM 23 install when llvm-config is not on PATH.
llvm-sys = { version = "231", optional = true }
md-5 = "0.10"
sha1 = "0.10"

[target.'cfg(target_vendor = "apple")'.dependencies]
glob = "~0.3.3"

[[bin]]
name = "rllvm-cc"
path = "src/bin/rllvm_cc.rs"

[[bin]]
name = "rllvm-cxx"
path = "src/bin/rllvm_cxx.rs"

[[bin]]
name = "rllvm-get-bc"
path = "src/bin/rllvm_get_bc.rs"

[[bin]]
name = "rllvm-init"
path = "src/bin/rllvm_init.rs"

[[bin]]
name = "rllvm-completions"
path = "src/bin/rllvm_completions.rs"

[[bin]]
name = "rllvm-rustc"
path = "src/bin/rllvm_rustc.rs"

[[bin]]
name = "rllvm-info"
path = "src/bin/rllvm_info.rs"

[[bin]]
name = "rllvm-compdb"
path = "src/bin/rllvm_compdb.rs"

[[bin]]
name = "rllvm-query"
path = "src/bin/rllvm_query.rs"
required-features = ["query"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# `killpg` for the example harness's timeout. Shelling out to `kill` with a
# negative pid is not portable: BSD and procps parse it differently.
libc = "0.2"
# Reading the manifests back in tests/packaging.rs; same version as the
# dependency above.
toml = "~0.8"

[[bench]]
name = "rllvm_benchmarks"
harness = false

# Without this the test target compiles by default, and its `rllvm::query`
# imports break `cargo test` for anyone not building the `query` feature.
[[test]]
name = "query"
path = "tests/query.rs"
required-features = ["query"]
