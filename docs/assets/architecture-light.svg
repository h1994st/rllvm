<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
<title id="t">rllvm architecture</title>
<desc id="d">Capture: rllvm-cc, rllvm-cxx and rllvm-rustc run the real compiler and also write a bitcode module per source, recording its path in each object's .rllvm_bc section. Link: the ordinary linker concatenates those sections, so the binary lists every module. Extract: rllvm-get-bc and rllvm-info read the list back into a module catalog or a whole-program .bc; rllvm-compdb builds modules from compile_commands.json instead. Analyze: rllvm-query answers source-level questions across C, C++ and Rust, reports what it could not see, and serves the same queries over MCP.</desc>
<style>
svg{--bg:#ffffff;--ink:#232A35;--muted:#59636e;--trace:#232A35;--tile:#232A35;--halo:none;--halo-w:0;--tile-txt:#ffffff;--ghost:#8c959f;--disc:#232A35;--disc-txt:#ffffff;--amber:#E0960F;--amber-txt:#8a5a00;--violet:#8B5CF6;--blue:#2F7BFF;--mint:#3DE8AA;--dash:#8c959f;--faint:#ffffff}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.st{font-size:17px;font-weight:700}
.num{font-size:12px;font-weight:700;fill:var(--disc-txt)}
.c1{font-size:13px;font-weight:600}
.c2{font-size:12px;fill:var(--muted)}
.tt{fill:var(--tile-txt);font-weight:600}
.ink{fill:var(--ink)}
.tile{fill:var(--tile);stroke:var(--halo);stroke-width:var(--halo-w)}
.ghost{fill:none;stroke:var(--ghost);stroke-width:1.2}
.bgfill{fill:var(--bg)}
.trace{fill:none;stroke:var(--trace);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.side{fill:none;stroke:var(--dash);stroke-width:1.6;stroke-dasharray:5 4;stroke-linecap:round}
.edge{stroke:var(--trace);stroke-width:2;fill:none}
@keyframes run{0%{transform:translateX(0);opacity:0}4%{opacity:1}94%{opacity:1}100%{transform:translateX(704px);opacity:0}}
@media (prefers-reduced-motion:no-preference){
.pk{animation:run 8s linear infinite}

.p0{animation-delay:0.00s}
.p1{animation-delay:-1.00s}
.p2{animation-delay:-2.00s}
.p3{animation-delay:-3.00s}
.p4{animation-delay:-4.00s}
.p5{animation-delay:-5.00s}
.p6{animation-delay:-6.00s}
.p7{animation-delay:-7.00s}
}
</style>
