<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
<title id="t">rllvm-query call graph with an agent overlay</title>
<desc id="d">LLVM proves main calls dispatch and dispatch calls parse_frame. dispatch also calls o->on_event through record field ops@8, which LLVM bound to no target; resolution-candidates lists handler, log_event and reset. An agent's overlay, beside the unchanged catalog, adds dispatch to handler via ops@8 with high confidence, later confirmed, and a refuted edge to reset that is never walked. It also annotates argument 2 of memcpy at clamp.c:14 as infeasible. reach main handler --include-overlay --annotations returns main, dispatch, handler with the last step labeled agent, reports not proven, and lists the annotation under annotated_flows. Without --include-overlay the path stops at the unresolved site.</desc>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="var(--edge)"/></marker>
<marker id="av" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="var(--violet)"/></marker>
</defs>
<style>
svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#232A35;--muted:#59636e;--edge:#232A35;--tile:#232A35;--halo:none;--halo-w:0;--ghost:#8c959f;--amber:#E0960F;--amber-txt:#8a5a00;--violet:#8B5CF6;--violet-txt:#6d3fd6;--blue:#2F7BFF;--mint:#3DE8AA;--pill-txt:#ffffff}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.nm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600}
.lang{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;font-weight:400;fill:var(--muted)}
.mu{fill:var(--muted)}
.sm{font-size:11.5px}
.vt{fill:var(--violet-txt)}
.at{fill:var(--amber-txt)}
.tile{fill:var(--tile);stroke:var(--halo);stroke-width:var(--halo-w)}
.gp{fill:var(--bg);stroke:var(--ghost);stroke-width:1.6}
.proven{stroke:var(--edge);stroke-width:2.5;fill:none}
.cand{stroke:var(--ghost);stroke-width:1.3;stroke-dasharray:1.5 4;stroke-linecap:round;fill:none}
.agent{stroke:var(--violet);stroke-width:2.6;stroke-dasharray:7 5;fill:none}
.vc{opacity:1}.vu{opacity:0}
@media (prefers-reduced-motion:no-preference){
.pk{animation:walk 7s linear infinite}
.vu{animation:vu 7s step-end infinite}
.vc{animation:vc 7s step-end infinite}
.agent.live{animation:march 1s linear infinite}
}
@keyframes march{to{stroke-dashoffset:-12}}
@keyframes vu{0%{opacity:1}68%{opacity:0}}
@keyframes vc{0%{opacity:0}68%{opacity:1}}

@keyframes walk{0%{transform:translate(64px,112px);opacity:0;fill:var(--mint)}6%{transform:translate(64px,112px);opacity:1;fill:var(--mint)}26%{transform:translate(224px,112px);opacity:1;fill:var(--blue)}40%{transform:translate(388px,112px);opacity:1;fill:var(--blue)}60%{transform:translate(548px,56px);opacity:1;fill:var(--violet)}66%{transform:translate(548px,56px);opacity:0;fill:var(--violet)}100%{transform:translate(548px,56px);opacity:0;fill:var(--violet)}}
</style>
<rect width="960" height="420" fill="var(--bg)"/>
<path class="cand" d="M398 112 L538 56"/>
<path class="cand" d="M398 112 L538 128"/>
<path class="cand" d="M398 112 L538 200"/>
<path class="proven" d="M73 112 H213" marker-end="url(#ah)"/>
<path class="proven" d="M224 121 V185" marker-end="url(#ah)"/>
<path class="proven" d="M233 112 H378"/>
<path class="proven" d="M557 56 H809" marker-end="url(#ah)"/>
<g opacity="0.38"><path class="agent" d="M398 116 L537 197" marker-end="url(#av)"/></g>
<path d="M486.52 165.08 l12 12 M498.52 165.08 l-12 12" stroke="var(--violet)" stroke-width="2.4" stroke-linecap="round"/>
<text class="sm vt" x="484.52" y="193.08" text-anchor="end">refuted, never walked</text>
<path class="agent live" d="M397 107 L537 59" marker-end="url(#av)"/>
<rect class="pk" x="-5" y="-5" width="10" height="10" rx="2.5" fill="var(--mint)" transform="translate(144.0 112)"/>
<circle cx="64" cy="112" r="8" class="tile"/><circle cx="64" cy="112" r="4.0" fill="var(--mint)"/>
<text class="nm" x="54" y="94" text-anchor="start">main<tspan class="lang" dx="6">Rust</tspan></text>
<circle cx="224" cy="112" r="8" class="tile"/><circle cx="224" cy="112" r="4.0" fill="var(--blue)"/>
<text class="nm" x="214" y="94" text-anchor="start">dispatch<tspan class="lang" dx="6">C</tspan></text>
<circle cx="224" cy="196" r="8" class="tile"/><circle cx="224" cy="196" r="4.0" fill="var(--blue)"/>
<text class="nm" x="240" y="200.5" text-anchor="start">parse_frame<tspan class="lang" dx="6">C</tspan></text>
<circle cx="388" cy="112" r="9" fill="var(--bg)" stroke="var(--amber)" stroke-width="2.2" stroke-dasharray="3.4 2.6"/>
<text class="m" style="font-size:12.5px" x="392" y="140" text-anchor="end">o-&gt;on_event(...)</text>
<text class="m sm mu" x="392" y="157" text-anchor="end">ops@8 (on_event)</text>
<text class="sm at" x="392" y="173" text-anchor="end" style="font-weight:600">LLVM bound no target</text>
<circle cx="548" cy="56" r="8" class="tile"/><circle cx="548" cy="56" r="4.0" fill="var(--blue)"/>
<text class="nm" x="538" y="38" text-anchor="start">handler<tspan class="lang" dx="6">C</tspan></text>
<circle class="gp" cx="548" cy="128" r="8"/>
<text class="nm mu" x="564" y="132.5" text-anchor="start">log_event<tspan class="lang" dx="6">C</tspan></text>
<circle class="gp" cx="548" cy="200" r="8"/>
<text class="nm mu" x="564" y="204.5" text-anchor="start">reset<tspan class="lang" dx="6">C</tspan></text>
<rect x="528" y="22" width="126" height="198" rx="12" fill="none" stroke="var(--ghost)" stroke-width="1.2" stroke-dasharray="2 4" stroke-linecap="round"/>
<text class="m sm mu" x="532" y="236">resolution-candidates</text>
<rect x="318" y="38" width="84" height="18" rx="9" fill="var(--violet)"/><text class="" x="360.0" y="50.8" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:var(--pill-txt)">agent, high</text>
<g class="vu"><rect x="406" y="38" width="80" height="18" rx="9" fill="var(--bg)" stroke="var(--ghost)" stroke-width="1.5"/><text class="" x="446.0" y="50.8" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:var(--muted)">unverified</text></g><g class="vc"><rect x="406" y="38" width="80" height="18" rx="9" fill="var(--bg)" stroke="var(--violet)" stroke-width="1.5"/><text class="" x="446.0" y="50.8" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:var(--violet-txt)">confirmed</text></g>
<circle class="gp" cx="820" cy="56" r="8"/>
<text class="nm" x="810" y="38" text-anchor="start">memcpy</text>
<text class="m sm mu" x="708" y="48" text-anchor="middle">clamp.c:14</text>
<path d="M708 56 V92" stroke="var(--violet)" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="708" cy="56" r="3.5" fill="var(--violet)"/>
<rect x="662" y="92" width="278" height="62" rx="8" fill="var(--panel)" stroke="var(--violet)" stroke-width="1.4" stroke-dasharray="5 3"/>
<rect x="672" y="102" width="65" height="18" rx="9" fill="var(--violet)"/><text class="" x="704.5" y="114.8" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:var(--pill-txt)">annotate</text>
<text class="sm" x="745" y="115"><tspan>arg 2: </tspan><tspan class="at" style="font-weight:700">infeasible</tspan><tspan class="mu">, high</tspan></text>
<text class="m sm mu" x="672" y="140">clamp.c:13: n = len &lt; CAP ? len : CAP</text>
<g transform="translate(24 0)"><path class="proven" d="M0 262 H28"/></g>
<text class="sm mu" x="60" y="266">LLVM-proven call</text>
<g transform="translate(179 0)"><path class="agent" d="M0 262 H28"/></g>
<text class="sm mu" x="215" y="266">agent edge, in catalog.overlay.jsonl</text>
<g transform="translate(458 0)"><path class="cand" d="M0 262 H28"/></g>
<text class="sm mu" x="494" y="266">candidate</text>
<g transform="translate(570 0)"><circle cx="14" cy="262" r="6" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="3 2.2"/></g>
<text class="sm mu" x="606" y="266">unresolved site</text>
<text class="sm mu" x="936" y="266" text-anchor="end">catalog.json never changes</text>
<rect x="16" y="284" width="928" height="128" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text class="m" style="font-size:12.5px;font-weight:600" x="34" y="310"><tspan class="mu">$ </tspan>rllvm-query --catalog catalog.json reach main handler --include-overlay --annotations</text>
<rect x="34" y="323" width="56" height="18" rx="9" fill="var(--edge)"/><text class="" x="62.0" y="335.8" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:var(--bg)">direct</text>
<text class="m" style="font-size:12.5px" x="102" y="336">main -&gt; dispatch</text>
<rect x="34" y="347" width="56" height="18" rx="9" fill="var(--violet)"/><text class="" x="62.0" y="359.8" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:var(--pill-txt)">agent</text>
<text class="m vu" style="font-size:12.5px" x="102" y="360">dispatch -&gt; handler at ops.c:10 via ops@8 [high, unverified]</text>
<text class="m vc" style="font-size:12.5px" x="102" y="360">dispatch -&gt; handler at ops.c:10 via ops@8 [high, confirmed]</text>
<text class="m sm vt" x="102" y="379">ops.c:8: o-&gt;on_event = handler</text>
<text class="sm mu" x="34" y="402">Without --include-overlay, the path stops at o-&gt;on_event.</text>
<line x1="602" y1="324" x2="602" y2="400" stroke="var(--line)"/>
<rect x="618" y="323" width="304" height="18" rx="9" fill="var(--amber)"/><text class="m" x="770.0" y="335.8" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:#232A35">not proven: this path uses 1 agent edge(s)</text>
<text class="m sm" style="font-weight:600" x="618" y="364">annotated_flows</text>
<rect x="618" y="375" width="56" height="18" rx="9" fill="var(--violet)"/><text class="" x="646.0" y="387.8" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:var(--pill-txt)">agent</text>
<text class="m sm" x="684" y="388">clamp.c:14 arg 2 <tspan class="at" style="font-weight:700">infeasible</tspan></text>
</svg>
