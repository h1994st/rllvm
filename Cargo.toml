[workspace]
resolver = "3"
# `crates/query` is a member but deliberately not a default member: it links
# LLVM through llvm-sys, and a bare `cargo test` or `cargo clippy` must not
# have to build it.
# rllvm-testkit is deliberately absent: cargo still treats it as a member,
# because it is a path dependency of members, but release-please's
# cargo-workspace plugin reads this array literally and would otherwise
# patch-bump an unpublished crate on every release.
members = ["crates/core", "crates/tools", "crates/query"]
default-members = ["crates/core", "crates/tools"]
# Nested packages that are fixtures or demos, not members. Without this, any
# cargo command run inside them walks up, finds this workspace, and fails with
# "current package believes it's in a workspace when it's not".
exclude = [
  "examples/rust",
  "benchmarks/tests/fixtures/cargo",
  "crates/tools/tests/data/cargo_fixture",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Shengtuo Hu <h1994st@gmail.com>"]
homepage = "https://shengtuo.me/rllvm"
repository = "https://github.com/h1994st/rllvm"

# Versions shared by more than one member live here so the two cannot drift.
# Single-member dependencies stay in that member's manifest.
[workspace.dependencies]
clap = { version = "~4.5.48", features = ["derive"] }
clap_complete = "~4.5"
glob = "~0.3.3"
object = { version = "~0.40.0", features = ["all"] }
owo-colors = "~4.1"
serde = { version = "~1.0.227", features = ["derive"] }
serde_json = "1.0"
tempfile = "~3"
toml = "~0.8"
tracing = "~0.1"
tracing-subscriber = { version = "~0.3", features = ["env-filter"] }
which = "~8.0.0"

# Profiles are only honoured at the workspace root; cargo warns and ignores them
# in a member manifest.
[profile.bench]
debug = true

[profile.dist]
inherits = "release"
lto = "thin"
