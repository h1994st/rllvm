[workspace]
resolver = "3"
members = ["crates/core", "crates/tools", "crates/testkit"]
default-members = ["crates/core", "crates/tools", "crates/testkit"]
# Nested packages that are fixtures or demos, not members. Without this, any
# cargo command run inside them walks up, finds this workspace, and fails with
# "current package believes it's in a workspace when it's not".
exclude = [
  "examples/rust",
  "benchmarks/tests/fixtures/cargo",
  "crates/tools/tests/data/cargo_fixture",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Shengtuo Hu <h1994st@gmail.com>"]
homepage = "https://shengtuo.me/rllvm"
repository = "https://github.com/h1994st/rllvm"

# Profiles are only honoured at the workspace root; cargo warns and ignores them
# in a member manifest.
[profile.bench]
debug = true

[profile.dist]
inherits = "release"
lto = "thin"
